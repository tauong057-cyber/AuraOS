# ==============================================================================
# AuraOS Picom Compositor Configuration (macOS Glassmorphism Style)
# ==============================================================================

# Backend (glx for smooth GPU acceleration / xrender for fallback)
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;

# Shadows (Soft elegant macOS drop shadows)
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.35;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Plank'"
];

# Fading (Smooth window animations)
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;

# Transparency / Opacity
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'Xfce4-terminal'",
  "95:class_g = 'Thunar'",
  "98:class_g = 'Rofi'"
];

# Rounded Corners (macOS 12+ style bo tròn tinh tế)
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Plank'"
];

# Dual Kawase Background Blur (Frosted Glass Effect)
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
}

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Window Type Settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-to-parts = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; shadow = true; };
  dropdown_menu = { opacity = 0.95; shadow = true; };
};
