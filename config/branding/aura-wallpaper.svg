<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="40%" stop-color="#141836" />
      <stop offset="75%" stop-color="#1f1847" />
      <stop offset="100%" stop-color="#0a0a18" />
    </linearGradient>

    <!-- Wave Gradient 1 (Cyan to Blue) -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <!-- Wave Gradient 2 (Purple to Pink) -->
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ffb199" stop-opacity="0.15" />
    </linearGradient>

    <!-- Wave Gradient 3 (Vibrant Violet / Indigo) -->
    <linearGradient id="wave3" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7028e4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e5b2ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#182848" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="3840" height="2160" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="900" cy="600" r="700" fill="#3a1c71" opacity="0.6" filter="url(#glow)" />
  <circle cx="2800" cy="1400" r="850" fill="#d76d77" opacity="0.4" filter="url(#glow)" />
  <circle cx="2000" cy="900" r="600" fill="#00c6ff" opacity="0.35" filter="url(#glow)" />

  <!-- Dynamic Curved Ribbon Waves (macOS style) -->
  <path d="M-200,1600 C600,1200 1200,1900 2000,1300 C2800,700 3400,1500 4100,1000 L4100,2300 L-200,2300 Z" fill="url(#wave3)" />
  <path d="M-200,1400 C800,900 1400,1700 2200,1100 C3000,500 3600,1200 4100,800 L4100,2300 L-200,2300 Z" fill="url(#wave1)" opacity="0.75" />
  <path d="M-200,1800 C500,1500 1300,1300 2100,1600 C2900,1900 3500,1100 4100,1400 L4100,2300 L-200,2300 Z" fill="url(#wave2)" opacity="0.65" />

  <!-- Subtle AuraOS Logo Watermark in Center (Very faint and elegant) -->
  <g transform="translate(1920, 1080) scale(0.6)" opacity="0.08" stroke="#ffffff" stroke-width="6" fill="none">
    <circle cx="0" cy="0" r="140" />
    <circle cx="0" cy="0" r="220" stroke-dasharray="10 15" />
    <circle cx="0" cy="0" r="300" stroke-width="3" />
  </g>
</svg>
